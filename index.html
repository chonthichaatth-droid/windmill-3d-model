<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Wind Turbine Cutaway Model - แรงและการเปลี่ยนแปลงการเคลื่อนที่</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121824;
            color: #fff;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.85);
            padding: 20px;
            border-radius: 12px;
            max-width: 340px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 { font-size: 18px; margin-top: 0; color: #38bdf8; }
        p { font-size: 13px; line-height: 1.5; color: #cbd5e1; }
        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        button {
            background: #0284c7;
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover { background: #0ea5e9; transform: translateY(-1px); }
        button:active { transform: translateY(0); }
        #info-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            max-width: 650px;
            margin: 0 auto;
            background: rgba(15, 23, 42, 0.9);
            padding: 15px 20px;
            border-radius: 10px;
            border-left: 5px solid #38bdf8;
            display: none;
            z-index: 10;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        #info-title { font-weight: bold; font-size: 16px; margin-bottom: 5px; color: #38bdf8; }
        #info-desc { font-size: 13.5px; margin: 0; color: #e2e8f0; }
        .instruction {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 12px;
            color: #94a3b8;
            border: 1px solid rgba(255,255,255,0.05);
        }
    </style>
    <!-- Three.js และ OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-overlay">
        <h1 id="ui-title">โมเดลจำลองกังหันลม (Wind Turbine 3D)</h1>
        <p id="ui-subtitle">คลิกที่ชิ้นส่วนภายในหรือภายนอก เพื่อศึกษาแรงและการแปลงพลังงาน พร้อมเสียงบรรยาย</p>
        <div class="btn-group">
            <button onclick="toggleExplode()">🧩 แยก/ประกอบชิ้นส่วน</button>
            <button onclick="toggleRotation()">🔄 หยุด/หมุน 360°</button>
            <button onclick="switchLanguage()">🌐 TH / EN</button>
        </div>
    </div>

    <div class="instruction">
        💡 หมุน: คลิกซ้ายค้างแล้วลาก | ซูม: เลื่อน Scroll เมาส์ | เลือกชิ้นส่วน: คลิกที่วัตถุ
    </div>

    <div id="info-panel">
        <div id="info-title">ชื่อชิ้นส่วน</div>
        <p id="info-desc">คำอธิบายการทำงาน...</p>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let turbineGroup, bladesGroup;
        let isExploded = false;
        let isRotating = true;
        let currentLang = 'th'; 
        let selectedPart = null;

        // ข้อมูลชิ้นส่วน (2 ภาษา) อ้างอิงตามโครงสร้างจริงและภาพตัวอย่างแบบผ่าซีก
        const partData = {
            blades: {
                th: { title: "1. ใบพัดกังหันลม (Rotor Blades)", desc: "ทำหน้าที่รับแรงลม (Dynamic Aero) ใช้หลักการความแตกต่างของความดันอากาศ (Airfoil Lift Force) ทำให้เกิดแรงยกและเปลี่ยนพลังงานจลน์ของลมเป็นพลังงานกลในการหมุน" },
                en: { title: "1. Rotor Blades", desc: "Capture wind energy using aerodynamic lift principles to convert kinetic wind energy into mechanical rotation." },
                mesh: null,
                normalPos: {x: 0, y: 3.5, z: 1.8},
                explodedPos: {x: 0, y: 3.5, z: 3.5}
            },
            hub: {
                th: { title: "2. ดุมล้อ (Rotor Hub)", desc: "จุดศูนย์กลางยึดใบพัดทั้งสามเข้ากับเพลาแกนหลัก ถ่าย100% ของแรงบิดและแรงหมุนรอบทิศทาง 360 องศาเข้าสู่ห้องเครื่อง" },
                en: { title: "2. Rotor Hub", desc: "Connects the rotor blades to the main shaft, transmitting torque and 360-degree rotational force into the nacelle." },
                mesh: null,
                normalPos: {x: 0, y: 3.5, z: 1.0},
                explodedPos: {x: 0, y: 3.5, z: 2.2}
            },
            gearbox: {
                th: { title: "3. กระปุกเกียร์ (Gearbox - สีแดงชมพู)", desc: "ทำหน้าที่ทดรอบความเร็ว จากแกนหมุนความเร็วต่ำของใบพัดให้กลายเป็นความเร็วรอบสูงที่จำเป็นต่อการผลิตไฟฟ้าของเครื่องกำเนิดไฟฟ้า" },
                en: { title: "3. Gearbox", desc: "Increases the rotational speed from the low-speed rotor shaft to the high-speed shaft required for electricity generation." },
                mesh: null,
                normalPos: {x: 0, y: 3.5, z: -0.1},
                explodedPos: {x: 0, y: 3.5, z: 0.5}
            },
            generator: {
                th: { title: "4. เครื่องกำเนิดไฟฟ้า (Generator - ทรงกระบอกสีดำ)", desc: "แปลงพลังงานกลความเร็วสูงที่ได้รับจากกระปุกเกียร์ ให้เปลี่ยนเป็นพลังงานไฟฟ้าด้วยหลักการเหนี่ยวนำแม่เหล็กไฟฟ้า" },
                en: { title: "4. Generator", desc: "Converts high-speed mechanical rotation energy into electrical energy using electromagnetic induction." },
                mesh: null,
                normalPos: {x: 0, y: 3.5, z: -1.1},
                explodedPos: {x: 0, y: 3.5, z: -1.0}
            },
            nacelle: {
                th: { title: "5. ห้องเครื่องผ่าซีก (Cutaway Nacelle)", desc: "โครงสร้างครอบปกป้องกลไกภายใน พร้อมระบบปรับทิศทางห้องเครื่อง (Yaw System) ให้หันรับลมตามทิศทางลมธรรมชาติเสมอ" },
                en: { title: "5. Cutaway Nacelle", desc: "Houses internal machinery with a cutaway view and includes a yaw system to orient the turbine towards the wind." },
                mesh: null,
                normalPos: {x: 0, y: 3.5, z: -0.5},
                explodedPos: {x: 0, y: 5.5, z: -0.5}
            },
            anemometer: {
                th: { title: "6. อุปกรณ์วัดความเร็ว/ทิศทางลม (Anemometer & Wind Vane)", desc: "ติดตั้งอยู่บนหลังห้องเครื่อง เพื่อตรวจวัดความเร็วและทิศทางลม ส่งข้อมูลให้ระบบควบคุมกังหันทำงานได้อย่างแม่นยำ" },
                en: { title: "6. Anemometer & Wind Vane", desc: "Mounted on top of the nacelle to measure wind speed and direction for control systems." },
                mesh: null,
                normalPos: {x: 0, y: 4.3, z: -1.4},
                explodedPos: {x: 0, y: 6.3, z: -1.4}
            },
            tower: {
                th: { title: "7. เสากังหันลม (Tower)", desc: "โครงสร้างเหล็กทรงกระบอกสูง รับน้ำหนักทั้งหมดของห้องเครื่องและใบพัด ไว้ในระดับความสูงที่กระแสลมมีความเร็วและสม่ำเสมอ" },
                en: { title: "7. Tower", desc: "Supports the nacelle and rotor at a height where wind speeds are stronger and more stable." },
                mesh: null,
                normalPos: {x: 0, y: 0, z: 0},
                explodedPos: {x: 0, y: -2.5, z: 0}
            }
        };

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(6, 4, 7);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(12, 22, 18);
            scene.add(dirLight);

            createTurbineModel();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('click', onMouseClick);
        }

        function createTurbineModel() {
            turbineGroup = new THREE.Group();

            const matSteel = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.25 });
            const matWhite = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.2 });
            const matRedAccent = new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.4 });
            const matGearPink = new THREE.MeshStandardMaterial({ color: 0xf43f5e, roughness: 0.35 });
            const matGeneratorDark = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4 });
            const matTransparentNacelle = new THREE.MeshPhysicalMaterial({ 
                color: 0xf8fafc, 
                transparent: true, 
                opacity: 0.35, 
                roughness: 0.1, 
                metalness: 0.1,
                side: THREE.DoubleSide
            });

            // 1. Tower (เสากังหัน)
            const towerGeo = new THREE.CylinderGeometry(0.35, 0.65, 7, 32);
            const tower = new THREE.Mesh(towerGeo, matSteel);
            tower.position.y = 0;
            tower.castShadow = true;
            tower.name = 'tower';
            partData.tower.mesh = tower;
            turbineGroup.add(tower);

            // Tower Red Band
            const bandGeo = new THREE.CylinderGeometry(0.7, 0.7, 0.4, 32);
            const band = new THREE.Mesh(bandGeo, matRedAccent);
            band.position.y = 2.5;
            tower.add(band);

            // 2. Nacelle Cutaway (ห้องเครื่องผ่าซีก)
            const nacelleGroup = new THREE.Group();
            nacelleGroup.position.set(0, 3.5, 0);
            nacelleGroup.name = 'nacelle';
            partData.nacelle.mesh = nacelleGroup;

            // Nacelle Body (transparent box cutaway)
            const nacelleGeo = new THREE.BoxGeometry(0.8, 0.8, 2.2);
            const nacelle = new THREE.Mesh(nacelleGeo, matTransparentNacelle);
            nacelle.castShadow = true;
            nacelleGroup.add(nacelle);

            // 3. Gearbox (กระปุกเกียร์ - สีชมพูแดง)
            const gearboxGeo = new THREE.BoxGeometry(0.5, 0.35, 0.8);
            const gearbox = new THREE.Mesh(gearboxGeo, matGearPink);
            gearbox.position.z = -0.1;
            gearbox.castShadow = true;
            gearbox.name = 'gearbox';
            partData.gearbox.mesh = gearbox;
            nacelleGroup.add(gearbox);

            // 4. Generator (เครื่องกำเนิด - สีดำ)
            const generatorGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.7, 16);
            const generator = new THREE.Mesh(generatorGeo, matGeneratorDark);
            generator.rotation.z = Math.PI / 2;
            generator.position.z = -1.1;
            generator.castShadow = true;
            generator.name = 'generator';
            partData.generator.mesh = generator;
            nacelleGroup.add(generator);

            // 5. Anemometer (อุปกรณ์วัดลม)
            const anemometryGroup = new THREE.Group();
            anemometryGroup.position.set(0, 0.8, -1.4);
            anemometryGroup.name = 'anemometer';
            partData.anemometer.mesh = anemometryGroup;

            const anemometerRod = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.3, 8), matSteel);
            anemometryGroup.add(anemometerRod);

            const anemometerCups = new THREE.Group();
            for (let i = 0; i < 3; i++) {
                const cupGeo = new THREE.SphereGeometry(0.08, 8, 8);
                const cup = new THREE.Mesh(cupGeo, matWhite);
                const angle = (i * Math.PI * 2) / 3;
                cup.position.set(Math.cos(angle) * 0.15, 0.15, Math.sin(angle) * 0.15);
                anemometerCups.add(cup);
            }
            anemometryGroup.add(anemometerCups);
            nacelleGroup.add(anemometryGroup);

            turbineGroup.add(nacelleGroup);

            // 6. Rotor Hub (ดุมล้อ)
            const hubGeo = new THREE.SphereGeometry(0.25, 16, 16);
            const hub = new THREE.Mesh(hubGeo, matWhite);
            hub.position.set(0, 3.5, 1.0);
            hub.castShadow = true;
            hub.name = 'hub';
            partData.hub.mesh = hub;
            turbineGroup.add(hub);

            // 7. Rotor Blades (ใบพัด)
            bladesGroup = new THREE.Group();
            bladesGroup.position.set(0, 3.5, 1.0);
            bladesGroup.name = 'blades';
            partData.blades.mesh = bladesGroup;

            for (let i = 0; i < 3; i++) {
                const bladeGeo = new THREE.BoxGeometry(0.18, 0.05, 1.8);
                const blade = new THREE.Mesh(bladeGeo, matWhite);
                blade.rotation.z = (i * Math.PI * 2) / 3;
                blade.castShadow = true;
                bladesGroup.add(blade);
            }
            turbineGroup.add(bladesGroup);

            scene.add(turbineGroup);
        }

        function toggleExplode() {
            isExploded = !isExploded;
            for (const key in partData) {
                const part = partData[key];
                if (part.mesh) {
                    const targetPos = isExploded ? part.explodedPos : part.normalPos;
                    animatePosition(part.mesh, targetPos, 800);
                }
            }
        }

        function toggleRotation() {
            isRotating = !isRotating;
        }

        function switchLanguage() {
            currentLang = currentLang === 'th' ? 'en' : 'th';
            if (selectedPart) {
                showPartInfo(selectedPart);
            }
        }

        function animatePosition(mesh, targetPos, duration) {
            const startPos = {x: mesh.position.x, y: mesh.position.y, z: mesh.position.z};
            const startTime = Date.now();

            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                mesh.position.x = startPos.x + (targetPos.x - startPos.x) * progress;
                mesh.position.y = startPos.y + (targetPos.y - startPos.y) * progress;
                mesh.position.z = startPos.z + (targetPos.z - startPos.z) * progress;

                if (progress < 1) requestAnimationFrame(animate);
            }
            animate();
        }

        function onMouseClick(event) {
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            
            const allMeshes = [];
            turbineGroup.traverse(child => {
                if (child.isMesh) allMeshes.push(child);
            });

            const intersects = raycaster.intersectObjects(allMeshes);
            
            if (intersects.length > 0) {
                const clickedObject = intersects[0].object;
                for (const key in partData) {
                    if (partData[key].mesh === clickedObject || partData[key].mesh.children.includes(clickedObject)) {
                        showPartInfo(key);
                        selectedPart = key;
                        return;
                    }
                }
            }
        }

        function showPartInfo(partKey) {
            const part = partData[partKey];
            const info = part[currentLang];
            document.getElementById('info-title').textContent = info.title;
            document.getElementById('info-desc').textContent = info.desc;
            document.getElementById('info-panel').style.display = 'block';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isRotating && bladesGroup) {
                bladesGroup.rotation.z += 0.01;
            }

            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
